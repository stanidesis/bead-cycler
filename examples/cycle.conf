# Optional bead-cycle config. Copy to .beads/cycle.conf (preferred) or
# beads/cycle.conf in the target Beads repo.
#
# KEY=VALUE only. Not sourced. Environment BEAD_CYCLE_* wins over this
# file; CLI flags win over both. Unset extra drain keys to keep generic
# close-out (descendants closed + eligible_for_close).

# BEAD_CYCLE_REVIEWER=copilot-pull-request-reviewer[bot]
# BEAD_CYCLE_BRANCH_PREFIX=feat/
# BEAD_CYCLE_MERGE_METHODS=squash,merge

# Timeouts / caps (same names as env)
# BEAD_CYCLE_MAX_ROUNDS=5
# BEAD_CYCLE_MAX_TURNS=80
# BEAD_CYCLE_POLL_SECONDS=15
# BEAD_CYCLE_REVIEW_TIMEOUT=600
# BEAD_CYCLE_CI_TIMEOUT=1200
# BEAD_CYCLE_MAX_BEADS=40

# Extra --drain gates. {n} = unpadded epic number; {nn} = two-digit.
# Origin/<default-branch> is the only artifact source.
#
# Example: Gitdown ADR 10 (id-map close-out child, epic write-up, changeset)
# BEAD_CYCLE_DRAIN_ID_MAP=beads/id-map.json
# BEAD_CYCLE_DRAIN_ID_MAP_EPIC_KEY=e{n}
# BEAD_CYCLE_DRAIN_ID_MAP_CLOSE_KEY=e{n}-close
# BEAD_CYCLE_DRAIN_WRITEUP_GLOB=docs/epics/E{nn}-*.md
# BEAD_CYCLE_DRAIN_WRITEUP_HEADINGS=Features,How to test,Changelist
# BEAD_CYCLE_DRAIN_WRITEUP_N_MIN=1
# BEAD_CYCLE_DRAIN_WRITEUP_N_MAX=10
# BEAD_CYCLE_DRAIN_CHANGESET_GLOB=.changeset/*.md
